# Pulls new Medium posts into src/data/medium.json once a day and commits the
# change. Hosts that deploy on push (Vercel, Netlify, …) then rebuild the site.
name: Sync Medium posts

on:
  schedule:
    - cron: "30 3 * * *" # daily, 03:30 UTC
  workflow_dispatch: # allow running by hand from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/sync-medium.mjs

      - name: Commit if posts changed
        run: |
          if git diff --quiet src/data/medium.json; then
            echo "No new posts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src/data/medium.json
          git commit -m "Sync Medium posts"
          git push
